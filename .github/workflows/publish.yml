name: publish

# Manual only. Nothing in this workflow runs on push, pull_request, or tag.
# See docs/RELEASING.md before running it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # Default: Trusted Publishing, no secret needed.
          # Fallback only if Trusted Publishing is not configured: the maintainer
          # stores an API token as the repository secret PYPI_API_TOKEN, then
          # uncomment the next line. Never paste a token value into this file.
          # password: ${{ secrets.PYPI_API_TOKEN }}
